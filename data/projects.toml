[[project]]
name = "Horcrux"
tagline = "Cryptographic File Vault"
description = "A CLI tool that secures sensitive files using AES-256-GCM envelope encryption. It deterministically generates the master encryption key and data encryption policies using Shamir's Secret Sharing (SSS) to ensure zero knowledge offline storage."
stack = ["Go"]
color = "green"
build = [
  "Encrypted Google Tink for memory-safe data wrapping of massive files.",
  "Built a custom Shamir's Secret Sharing math engine from scratch to handle key sharding.",
  "Designed a custom binary metadata header (HRX2) for secure key reconstruction and seamless file encryption."
]
repoURL = "https://github.com/sadisticbrew/Horcrux"
