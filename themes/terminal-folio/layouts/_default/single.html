{{ define "main" }}
<article class="section blog-post">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    <div class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      {{ if .Params.tags }}
      <div class="post-tags">
        {{ range .Params.tags }}
        <span class="tag">[{{ . }}]</span>
        {{ end }}
      </div>
      {{ end }}
    </div>
  </header>
  <div class="post-content terminal-card">
    {{ .Content }}
  </div>
  <div class="post-nav">
    <a href="/blog/" class="nav-link">← BACK TO BLOG.DIR</a>
  </div>
</article>
{{ end }}
